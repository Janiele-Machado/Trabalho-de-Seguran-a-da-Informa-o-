server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    location / {
        try_files $uri $uri/ =404;
    }

    # Unicos endpoints da API expostos ao portal publico
    location = /api/health {
        proxy_pass http://api:5000/health;
    }
    location = /api/submissao {
        limit_except POST { deny all; }
        proxy_pass http://api:5000/submissao;
        proxy_set_header Host $host;
    }

    # Qualquer outra rota da API fica inacessivel por aqui
    location /api/ {
        return 403;
    }
}
